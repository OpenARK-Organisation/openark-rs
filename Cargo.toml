[package]
name = "openark-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bdk_wallet = "2.3.0"
nostr-sdk = { git = "https://github.com/dukeh3/nostr" }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
testcontainers = "0.27"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
